# Same game as default.yaml, but the speaker learns with REINFORCE instead of Gumbel-softmax.
# Tuned on seed 0 (20 epochs): a small entropy bonus and a fast-moving baseline worked best
# (test acc ~0.80, 6 messages). entropy_coef 0.01 / baseline_decay 0.99 collapsed to 2 messages (~0.45).
mode: reinforce
entropy_coef: 0.001
baseline_decay: 0.9
epochs: 20
