# Same game as default.yaml, but the speaker learns with REINFORCE instead of Gumbel-softmax.
# The tuned REINFORCE settings (entropy_coef 0.001, baseline_decay 0.9) are the defaults in
# train.py; they are repeated here so this file documents them. entropy_coef 0.01 /
# baseline_decay 0.99 collapsed to 2 messages (~0.45 acc).
mode: reinforce
entropy_coef: 0.001
baseline_decay: 0.9
epochs: 20
